<!DOCTYPE html>
<html lang="sq"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f6b3f"><title>NH</title>
<style>
:root{--bg:#f4f8f5;--card:#fff;--tx:#14261b;--mu:#5d7266;--g:#0f6b3f;--gl:#dff0e6;--r:#c0392b;--rl:#fbe3df;--bd:#dde8e0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#18231d;--tx:#e8f2ec;--mu:#93a99b;--g:#3fbf7f;--gl:#1d3a2b;--r:#ff7a6b;--rl:#3b1f1b;--bd:#26362d}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,Roboto,sans-serif;font-size:16px}
header{background:var(--g);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
header button{background:none;border:0;color:#fff;font-size:14px}
main{padding:12px 14px 110px;max-width:640px;margin:0 auto}
.chips{display:flex;gap:6px;margin-bottom:12px}.chip{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 0;font-size:14px}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.box{background:var(--gl);border-radius:14px;padding:12px}.box.r{background:var(--rl)}.box.w{grid-column:span 2}.box b{display:block;font-size:22px;margin-top:4px}.box span{font-size:13px;color:var(--mu)}
.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.m{color:var(--mu);font-size:13px;margin-top:2px}.a{font-weight:700;white-space:nowrap}.a.g{color:var(--g)}.a.r{color:var(--r)}
.row button{background:none;border:0;color:var(--mu);font-size:13px;padding:2px 0 0}
h3{margin:16px 0 8px;font-size:16px}.empty{text-align:center;color:var(--mu);padding:30px 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 0 8px;font-size:12px}nav button.on{color:var(--g);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--g);color:#fff;border:0;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end}.sheet.on{display:flex}
.f{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:16px}.btns button{flex:1;padding:13px;border-radius:12px;border:0;font-size:16px;font-weight:600}.ok{background:var(--g);color:#fff}.no{background:var(--gl);color:var(--tx)}
.login{max-width:380px;margin:40px auto;padding:0 20px}.login h1{text-align:center;color:var(--g);font-size:44px;margin:10px 0 20px}.err{color:var(--r);font-size:14px;margin-top:10px;min-height:18px}
</style></head><body>
<header><span>NH</span><span id="who"></span></header>
<main id="app"></main>
<button class="fab" id="fab" style="display:none">+</button>
<nav id="nav" style="display:none"></nav>
<div class="sheet" id="sheet"><div class="f" id="frm"></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,updateProfile,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,addDoc,deleteDoc,doc,query,where,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const ADMIN="nhpablo7777@gmail.com";
const app=initializeApp({apiKey:"AIzaSyAb5VYsfZCIIuZ1sESeISkffqPU13b-RbQ",authDomain:"nhnh-f58ce.firebaseapp.com",projectId:"nhnh-f58ce",storageBucket:"nhnh-f58ce.firebasestorage.app",messagingSenderId:"472056568107",appId:"1:472056568107:web:df34a56ede376cb4238d6e"});
const auth=getAuth(app),db=getFirestore(app);
const TABS=[["home","Kryefaqja"],["d","Dhuratat"],["s","Shpenzime"],["l","Llogaritë"]];
const S={tab:"home",per:"all",list:[],user:null,admin:false,drv:null,unsub:null};
const $=i=>document.getElementById(i);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>Number(n||0).toLocaleString("sq-AL",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const nowT=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const fdate=s=>{const p=(s||"").split("-");return p.length==3?p[2]+"."+p[1]+"."+p[0]:s};
const val=e=>e.kind=="l"?+e.total||0:+e.amount||0;
function inPer(e){if(S.per=="all")return true;const d=new Date();d.setHours(0,0,0,0);if(S.per=="week")d.setDate(d.getDate()-6);return new Date(e.date+"T00:00:00")>=d}
const mine=()=>S.list.filter(e=>!S.admin||!S.drv||e.uid==S.drv);
const sum=(a,k)=>a.filter(e=>e.kind==k).reduce((t,e)=>t+val(e),0);

function loginView(mode){
  $("nav").style.display="none";$("fab").style.display="none";$("who").textContent="";
  const reg=mode=="reg";
  $("app").innerHTML='<div class="login"><h1>NH</h1>'+(reg?'<label>Emri yt</label><input id="ln" autocomplete="name">':"")+'<label>Email</label><input id="le" type="email" autocomplete="email"><label>Fjalëkalimi</label><input id="lp" type="password" autocomplete="'+(reg?"new-password":"current-password")+'"><div class="err" id="er"></div><div class="btns"><button class="ok" id="go">'+(reg?"Krijo llogari":"Hyr")+'</button></div><div class="btns"><button class="no" id="sw">'+(reg?"Kam llogari":"Krijo llogari të re")+'</button></div></div>';
  $("sw").onclick=()=>loginView(reg?"in":"reg");
  $("go").onclick=async()=>{
    const e=$("le").value.trim(),p=$("lp").value;$("er").textContent="";
    try{
      if(reg){const n=$("ln").value.trim();if(!n){$("er").textContent="Shkruaj emrin.";return}
        const c=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(c.user,{displayName:n});location.reload()}
      else await signInWithEmailAndPassword(auth,e,p);
    }catch(x){const m={"auth/invalid-credential":"Email ose fjalëkalim i gabuar.","auth/email-already-in-use":"Ky email ekziston.","auth/weak-password":"Fjalëkalimi duhet 6+ shkronja.","auth/invalid-email":"Email i pavlefshëm."};$("er").textContent=m[x.code]||"Gabim. Provo përsëri."}
  };
}

function render(){
  $("nav").style.display="flex";
  $("nav").innerHTML=TABS.map(t=>'<button data-t="'+t[0]+'" class="'+(S.tab==t[0]?"on":"")+'">'+t[1]+"</button>").join("");
  $("fab").style.display=S.tab=="home"?"none":"block";
  const all=mine();let h="";
  const bar=S.admin&&S.drv?'<div class="row" style="align-items:center"><span>Duke parë: <b>'+esc(nmOf(S.drv))+'</b></span><button data-u="">Të gjithë ✕</button></div>':"";
  if(S.tab=="home"){
    const f=all.filter(inPer);
    h=bar+'<div class="chips">'+[["today","Sot"],["week","7 ditë"],["all","Të gjitha"]].map(c=>'<button class="chip '+(S.per==c[0]?"on":"")+'" data-p="'+c[0]+'">'+c[1]+"</button>").join("")+"</div>";
    h+='<div class="grid"><div class="box"><span>Totali i dhuratave</span><b>'+eur(sum(f,"d"))+'</b></div><div class="box r"><span>Totali i shpenzimeve</span><b>'+eur(sum(f,"s"))+'</b></div><div class="box w"><span>Totali i llogarive</span><b>'+eur(sum(f,"l"))+"</b></div></div>";
    if(S.admin){
      const base=S.list.filter(inPer),ids=[...new Set(base.map(e=>e.uid))];
      const ln=(a,b,c)=>'<div class="m" style="display:flex;justify-content:space-between;margin-top:6px"><span>'+a+'</span><b style="color:'+c+'">'+b+"</b></div>";
      h+="<h3>Secili shofer veç e veç</h3>"+(ids.length?ids.map(u=>{const x=base.filter(e=>e.uid==u);return'<div class="row" data-u="'+u+'" style="display:block;cursor:pointer"><b style="font-size:17px">'+esc(nmOf(u))+"</b>"+ln("Dhuratat",eur(sum(x,"d")),"var(--g)")+ln("Shpenzime",eur(sum(x,"s")),"var(--r)")+ln("Llogaritë",eur(sum(x,"l")),"var(--tx)")+"</div>"}).join(""):'<div class="empty">Ende nuk ka të dhëna.</div>');
    }else h+='<div class="empty">Shtyp Dhuratat, Shpenzime ose Llogaritë për të shënuar.</div>';
  }else{
    const k=S.tab,x=all.filter(e=>e.kind==k).sort((a,b)=>(b.date+b.time)>(a.date+a.time)?1:-1);
    h=bar+'<div class="grid"><div class="box w '+(k=="s"?"r":"")+'"><span>Totali</span><b>'+eur(sum(x,k))+"</b></div></div>";
    h+=x.length?x.map(e=>{const t=k=="d"?"Dhuratë nga "+esc(e.text):k=="s"?esc(e.text):e.count+" llogari × "+eur(e.amount);
      return'<div class="row"><div><div>'+t+'</div><div class="m">'+fdate(e.date)+" · "+esc(e.time)+(S.admin?" · "+esc(e.name):"")+'</div><button data-x="'+e.id+'">Fshi</button></div><div class="a '+(k=="s"?"r":"g")+'">'+eur(val(e))+"</div></div>"}).join(""):'<div class="empty">Asgjë e shënuar. Shtyp + për të shtuar.</div>';
  }
  $("app").innerHTML=h;
}
const nmOf=u=>{const e=S.list.find(x=>x.uid==u);return e?e.name:"Shofer"};

function form(){
  const k=S.tab;let h="<b style='font-size:18px'>"+(k=="d"?"Dhuratë e re":k=="s"?"Shpenzim i ri":"Llogari e re")+"</b>";
  h+='<div class="two"><div><label>Data</label><input type="date" id="fd" value="'+today()+'"></div><div><label>Ora</label><input type="time" id="ft" value="'+nowT()+'"></div></div>';
  if(k!="l")h+='<label>'+(k=="d"?"Emri i personit":"Përshkrimi")+'</label><input id="f1"><label>Shuma (€)</label><input id="f2" type="number" inputmode="decimal" step="0.01">';
  else h+='<div class="two"><div><label>Nr. i llogarive</label><input id="f1" type="number" inputmode="numeric"></div><div><label>Shuma e llogarisë (€)</label><input id="f2" type="number" inputmode="decimal" step="0.01"></div></div><label>Totali (€)</label><input id="f3" type="number" inputmode="decimal" step="0.01">';
  h+='<div class="btns"><button class="no" id="cx">Anulo</button><button class="ok" id="sv">Ruaj</button></div>';
  $("frm").innerHTML=h;$("sheet").classList.add("on");
  if(k=="l"){const c=()=>{$("f3").value=((+$("f1").value||0)*(+$("f2").value||0)).toFixed(2)};$("f1").oninput=c;$("f2").oninput=c}
  $("cx").onclick=()=>$("sheet").classList.remove("on");
  $("sv").onclick=async()=>{
    const e={kind:k,uid:S.user.uid,name:S.user.displayName||"Shofer",date:$("fd").value||today(),time:$("ft").value||nowT()};
    if(k=="l"){e.count=+$("f1").value;e.amount=+$("f2").value;e.total=+$("f3").value;if(!e.count||!e.total){alert("Shkruaj numrin dhe totalin.");return}}
    else{e.text=$("f1").value.trim();e.amount=+$("f2").value;if(!e.text||!e.amount){alert(k=="d"?"Shkruaj emrin dhe shumën.":"Shkruaj përshkrimin dhe shumën.");return}}
    $("sv").disabled=true;
    try{await addDoc(collection(db,"entries"),e);$("sheet").classList.remove("on")}catch(x){$("sv").disabled=false;alert("Nuk u ruajt. Provo përsëri.")}
  };
}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");
  if(!b){const c=ev.target.closest("[data-u]");if(c&&S.admin){S.drv=c.dataset.u;render()}return}
  if(b.id=="out")signOut(auth);
  else if(b.dataset.u!==undefined){S.drv=b.dataset.u||null;render()}
  else if(b.dataset.t){S.tab=b.dataset.t;render()}
  else if(b.dataset.p){S.per=b.dataset.p;render()}
  else if(b.id=="fab")form();
  else if(b.dataset.x&&confirm("Të fshihet ky rresht?"))deleteDoc(doc(db,"entries",b.dataset.x));
});

onAuthStateChanged(auth,u=>{
  if(S.unsub){S.unsub();S.unsub=null}
  S.user=u;S.list=[];
  if(!u){loginView("in");return}
  S.admin=(u.email||"").toLowerCase()==ADMIN.toLowerCase();
  $("who").innerHTML=esc(S.admin?"Pronari":u.displayName||"")+' <button id="out">Dil</button>';
  const q=S.admin?collection(db,"entries"):query(collection(db,"entries"),where("uid","==",u.uid));
  render();
  S.unsub=onSnapshot(q,s=>{S.list=s.docs.map(d=>({...d.data(),id:d.id}));render()},()=>{$("app").innerHTML='<div class="empty">Nuk u lidh regjistri. Kontrollo rregullat e Firestore.</div>'});
});
</script></body></html>
